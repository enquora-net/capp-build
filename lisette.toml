[project]
name = "capp-build"
version = "0.1.0"

[dependencies.go]
"github.com/spf13/cobra" = "v1.10.2"
"github.com/spf13/pflag" = { version = "v1.0.9", via = ["github.com/spf13/cobra"] }
"github.com/cpuguy83/go-md2man/v2" = { version = "v2.0.6", via = ["github.com/spf13/cobra"] }
"github.com/russross/blackfriday/v2" = { version = "v2.1.0", via = ["github.com/cpuguy83/go-md2man/v2"] }
"go.yaml.in/yaml/v3" = { version = "v3.0.4", via = ["github.com/spf13/cobra"] }
"github.com/enquora-net/capp-parse" = "v0.0.0-20260527042417-cae65bc929fb"
"github.com/ebitengine/purego" = { version = "v0.10.0", via = ["github.com/enquora-net/capp-parse"] }
"github.com/mattn/go-pointer" = { version = "v0.0.1", via = ["github.com/tree-sitter/go-tree-sitter"] }
"github.com/tree-sitter/go-tree-sitter" = { version = "v0.25.0", via = ["github.com/enquora-net/capp-parse"] }
"golang.org/x/sys" = { version = "v0.43.0", via = ["golang.org/x/term"] }
"golang.org/x/term" = { version = "v0.42.0", via = ["github.com/enquora-net/capp-parse"] }
